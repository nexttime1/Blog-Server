basePath: /
definitions:
  advert_api.AdvertRequest:
    properties:
      href:
        description: 跳转链接
        type: string
      images:
        description: 图片
        type: string
      is_show:
        description: 是否展示
        type: boolean
      title:
        description: 显示的标题
        type: string
    required:
    - href
    - images
    - title
    type: object
  advert_api.AdvertUpdateRequest:
    properties:
      href:
        description: 跳转链接
        type: string
      images:
        description: 图片
        type: string
      is_show:
        description: 是否展示
        type: boolean
      title:
        description: 显示的标题
        type: string
    type: object
  article_service.ArticleAddRequest:
    properties:
      abstract:
        description: 文章简介
        type: string
      banner_id:
        description: 文章封面id
        type: integer
      category:
        description: 文章分类
        type: string
      content:
        description: 文章内容
        type: string
      link:
        description: 原文链接
        type: string
      source:
        description: 文章来源
        type: string
      tags:
        description: 文章标签
        items:
          type: string
        type: array
      title:
        description: 文章标题
        type: string
    required:
    - content
    - title
    type: object
  enum.ImageType:
    enum:
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - LocationType
    - QiNiuType
  enum.RoleType:
    enum:
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-varnames:
    - AdminRole
    - UserRole
    - VisitorRole
    - BlackRole
  image_api.ImageNameListResponse:
    properties:
      id:
        type: integer
      name:
        description: 图片名称
        type: string
      path:
        description: 图片路径
        type: string
    type: object
  image_api.ImageUpdateRequest:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - id
    - name
    type: object
  image_service.ImageListResponse:
    properties:
      filename:
        type: string
      filepath:
        type: string
      is_success:
        type: boolean
      msg:
        type: string
      size:
        type: number
    type: object
  menu_api.Banners:
    properties:
      id:
        type: integer
      path:
        type: string
    type: object
  menu_api.MenuListResponse:
    properties:
      UpdatedAt:
        type: string
      abstract:
        description: 简介
        items:
          type: string
        type: array
      abstract_time:
        description: 简介的切换时间
        type: integer
      banner_time:
        description: 菜单图片的切换时间 为 0 表示不切换
        type: integer
      banners:
        items:
          $ref: '#/definitions/menu_api.Banners'
        type: array
      createdAt:
        type: string
      id:
        type: integer
      path:
        type: string
      slogan:
        description: slogan
        type: string
      sort:
        description: 菜单的顺序
        type: integer
      title:
        type: string
    type: object
  menu_api.MenuNameListResponse:
    properties:
      id:
        type: integer
      path:
        type: string
      title:
        type: string
    type: object
  menu_service.ImageSort:
    properties:
      image_id:
        type: integer
      sort:
        type: integer
    type: object
  menu_service.MenuRequest:
    properties:
      abstract:
        items:
          type: string
        type: array
      abstract_time:
        description: 切换的时间，单位秒
        type: integer
      banner_time:
        description: 切换的时间，单位秒
        type: integer
      image_sort_list:
        description: 添加的图片和顺序
        items:
          $ref: '#/definitions/menu_service.ImageSort'
        type: array
      path:
        type: string
      slogan:
        type: string
      sort:
        description: 菜单的序号
        type: integer
      title:
        type: string
    required:
    - path
    - sort
    - title
    type: object
  message_service.MessageAddRequest:
    properties:
      content:
        type: string
      rev_user_id:
        description: 接收人id
        type: integer
      send_user_id:
        description: 发送人id
        type: integer
    type: object
  message_service.MessageRecordRequest:
    properties:
      user_id:
        type: integer
    required:
    - user_id
    type: object
  models.BannerModel:
    properties:
      UpdatedAt:
        type: string
      createdAt:
        type: string
      hash:
        description: 图片的hash值，用于判断重复图片
        type: string
      id:
        type: integer
      image_type:
        $ref: '#/definitions/enum.ImageType'
      name:
        description: 图片名称
        type: string
      path:
        description: 图片路径
        type: string
    type: object
  models.RemoveRequest:
    properties:
      IDList:
        items:
          type: integer
        type: array
    type: object
  res.Code:
    enum:
    - 0
    - 1001
    - 1002
    - 1003
    type: integer
    x-enum-comments:
      FailServiceCode: 服务异常
    x-enum-varnames:
    - SuccessCode
    - FailValidCode
    - FailServiceCode
    - FailArgumentCode
  res.DataListResponse:
    properties:
      count:
        type: integer
      list: {}
    type: object
  res.Response:
    properties:
      code:
        $ref: '#/definitions/res.Code'
      data: {}
      msg:
        type: string
    type: object
  tag_api.TagRequest:
    properties:
      title:
        type: string
    required:
    - title
    type: object
  user_api.UserPwdUpdateRequest:
    properties:
      new_pwd:
        type: string
      pwd:
        type: string
    required:
    - new_pwd
    - pwd
    type: object
  user_api.UserTypeUpdateRequest:
    properties:
      nick_name:
        description: 防止用户昵称非法，管理员有能力修改
        type: string
      role:
        allOf:
        - $ref: '#/definitions/enum.RoleType'
        enum:
        - 1
        - 2
        - 3
        - 4
      user_id:
        type: integer
    required:
    - role
    - user_id
    type: object
  user_service.EmailLoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  user_service.UserCreateRequest:
    properties:
      nick_name:
        description: 昵称
        type: string
      password:
        description: 密码
        type: string
      role:
        allOf:
        - $ref: '#/definitions/enum.RoleType'
        description: 权限  1 管理员  2 普通用户  3 游客
      user_name:
        description: 用户名
        type: string
    required:
    - nick_name
    - password
    - role
    - user_name
    type: object
host: 127.0.0.01:8080
info:
  contact: {}
  description: Blog_Server API文档
  title: Blog_Server API文档
  version: "1.0"
paths:
  /api/adverts:
    delete:
      consumes:
      - application/json
      description: 批量删除广告
      parameters:
      - description: 广告id列表
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.RemoveRequest'
      - description: token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误（如id格式错误、列表为空）
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: 部分广告id不存在
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 批量删除广告
      tags:
      - 广告管理
    get:
      description: 分页查询文章列表，支持根据标题条件筛选
      parameters:
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认10
        in: query
        name: limit
        type: integer
      - description: 用户认证令牌
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/res.Response'
            - properties:
                data:
                  $ref: '#/definitions/res.DataListResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 获取文章列表
      tags:
      - 文章管理
    post:
      consumes:
      - application/json
      description: 创建一个新的广告条目，包含标题、跳转链接、图片和展示状态
      parameters:
      - description: 广告信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/advert_api.AdvertRequest'
      - description: 用户认证令牌
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 创建广告
      tags:
      - 广告管理
  /api/adverts/{id}:
    put:
      consumes:
      - application/json
      description: 更新广告
      parameters:
      - description: 更新的广告信息（可选字段，如title/href等，不传则不更新）
        in: body
        name: data
        schema:
          $ref: '#/definitions/advert_api.AdvertUpdateRequest'
      - description: id
        in: path
        name: id
        required: true
        type: integer
      - description: token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误（如ID格式错误、标题重复等）
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: 广告不存在
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 更新广告
      tags:
      - 广告管理
  /api/articles:
    post:
      consumes:
      - application/json
      description: 创建一个新的文章，包含文章标题 文章内容等
      parameters:
      - description: 文章信息
        in: body
        name: data
        schema:
          $ref: '#/definitions/article_service.ArticleAddRequest'
      - description: 文章发布成功
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 添加文章
      tags:
      - 文章管理
  /api/email_login:
    post:
      consumes:
      - application/json
      description: 用户绑定邮箱 输入 邮箱 密码 验证码  第一次 只填 邮箱 必填  第二次 都是必填
      parameters:
      - description: 登录信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/user_service.EmailLoginRequest'
      - description: 用户认证令牌
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 用户绑定邮箱
      tags:
      - 用户管理
  /api/images:
    delete:
      consumes:
      - application/json
      description: 批量删除图片
      parameters:
      - description: 图片id列表
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.RemoveRequest'
      - description: token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误（如id格式错误、列表为空）
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: 部分图片id不存在
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 批量删除图片
      tags:
      - 图片管理
    get:
      description: 查询对应参数的图片
      parameters:
      - description: 输入对对应参数
        in: query
        name: path
        type: string
      - description: 输入对对应参数
        in: query
        name: hash
        type: string
      - description: 输入对对应参数
        in: query
        name: name
        type: string
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认10
        in: query
        name: limit
        type: integer
      - description: token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 对于图片的各个信息
          schema:
            allOf:
            - $ref: '#/definitions/res.Response'
            - properties:
                data:
                  $ref: '#/definitions/res.DataListResponse'
              type: object
      summary: 查看图片
      tags:
      - 图片管理
    post:
      consumes:
      - multipart/form-data
      description: 支持多图片上传，自动验证格式（白名单）和大小，重复图片会被拦截
      parameters:
      - description: 用户认证令牌
        in: header
        name: token
        required: true
        type: string
      - description: 图片文件列表（支持多文件，格式：jpg/jpeg/png/gif等）
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传结果列表（包含每个文件的上传状态、路径等信息）
          schema:
            allOf:
            - $ref: '#/definitions/res.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/image_service.ImageListResponse'
                  type: array
              type: object
        "400":
          description: 请求错误（如文件不存在、格式错误、大小超限等）
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器错误（如上传七牛云失败、保存文件失败等）
          schema:
            $ref: '#/definitions/res.Response'
      summary: 批量上传图片
      tags:
      - 图片管理
    put:
      consumes:
      - application/json
      description: 根据给出的id 去更新Name
      parameters:
      - description: 输入要修改的id和修改后的名字
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/image_api.ImageUpdateRequest'
      - description: token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误（如ID格式错误、标题重复等）
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: 图片不存在
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 更新图片
      tags:
      - 图片管理
  /api/images_name:
    get:
      description: 只返回一些重要的图片信息
      parameters:
      - description: token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/res.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/image_api.ImageNameListResponse'
                  type: array
              type: object
      summary: 图片名称列表
      tags:
      - 图片管理
  /api/menus:
    delete:
      consumes:
      - application/json
      description: 批量菜单删除
      parameters:
      - description: 菜单id列表
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.RemoveRequest'
      - description: token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误（如id格式错误、列表为空）
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: 部分菜单id不存在
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 批量菜单删除
      tags:
      - 菜单管理
    get:
      description: 等修改
      parameters:
      - description: 用户认证令牌
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/res.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/menu_api.MenuListResponse'
                  type: array
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 获取菜单列表
      tags:
      - 菜单管理
    post:
      consumes:
      - application/json
      description: 创建一个新的菜单，包含Title Slogan Abstract等
      parameters:
      - description: 菜单信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/menu_service.MenuRequest'
      - description: 用户认证令牌
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 添加菜单
      tags:
      - 菜单管理
  /api/menus/{id}:
    get:
      description: 获取某个菜单
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: integer
      - description: 用户认证令牌
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/res.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/menu_api.MenuListResponse'
                  type: array
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 获取某个菜单
      tags:
      - 菜单管理
    put:
      consumes:
      - application/json
      description: 菜单更新
      parameters:
      - description: 更新的菜单信息（可选字段，如title/path等，不传则不更新）
        in: body
        name: data
        schema:
          $ref: '#/definitions/menu_service.MenuRequest'
      - description: id
        in: path
        name: id
        required: true
        type: integer
      - description: token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误（如ID格式错误、标题重复等）
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: 菜单不存在
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 菜单更新
      tags:
      - 菜单管理
  /api/menus_name:
    get:
      description: 等修改
      parameters:
      - description: 用户认证令牌
        in: header
        name: token
        required: true
