basePath: /
definitions:
  advert_api.AdvertRequest:
    properties:
      href:
        description: 跳转链接
        type: string
      images:
        description: 图片
        type: string
      is_show:
        description: 是否展示
        type: boolean
      title:
        description: 显示的标题
        type: string
    required:
    - href
    - images
    - title
    type: object
  image_api.ImageNameListResponse:
    properties:
      id:
        type: integer
      name:
        description: 图片名称
        type: string
      path:
        description: 图片路径
        type: string
    type: object
  models.RemoveRequest:
    properties:
      IDList:
        items:
          type: integer
        type: array
    type: object
  res.Code:
    enum:
    - 0
    - 1001
    - 1002
    - 1003
    type: integer
    x-enum-comments:
      FailServiceCode: 服务异常
    x-enum-varnames:
    - SuccessCode
    - FailValidCode
    - FailServiceCode
    - FailArgumentCode
  res.Response:
    properties:
      code:
        $ref: '#/definitions/res.Code'
      data: {}
      msg:
        type: string
    type: object
host: 127.0.0.01:8080
info:
  contact: {}
  description: Blog_Server API文档
  title: Blog_Server API文档
  version: "1.0"
paths:
  /api/adverts:
    delete:
      description: 批量删除广告
      parameters:
      - description: token
        in: header
        name: token
        required: true
        type: string
      - description: 广告id列表
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.RemoveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
      summary: 批量删除广告
      tags:
      - 广告管理
    get:
      description: 查询广告
      parameters:
      - description: 跳转链接
        in: query
        name: href
        type: string
      - description: 图片
        in: query
        name: images
        type: string
      - description: 是否展示
        in: query
        name: is_show
        type: boolean
      - in: query
        name: key
        type: string
      - in: query
        name: limit
        type: integer
      - description: 前端可以覆盖
        in: query
        name: order
        type: string
      - in: query
        name: page
        type: integer
      - description: 显示的标题
        in: query
        name: title
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/res.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      summary: 广告列表
      tags:
      - 广告管理
    post:
      description: 创建一个广告
      parameters:
      - description: 表示多个参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/advert_api.AdvertRequest'
      - description: token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
      summary: 创建广告
      tags:
      - 广告管理
  /api/adverts/{id}:
    put:
      description: 更新广告
      parameters:
      - description: token
        in: header
        name: token
        required: true
        type: string
      - description: 广告的一些参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/advert_api.AdvertRequest'
      - description: id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/res.Response'
      summary: 更新广告
      tags:
      - 广告管理
  /api/images_name:
    get:
      description: 只返回一些重要的
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/res.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/image_api.ImageNameListResponse'
                  type: array
              type: object
      summary: 图片名称列表
      tags:
      - 图片管理
swagger: "2.0"
