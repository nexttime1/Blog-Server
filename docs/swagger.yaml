host: 127.0.0.01:8080
info:
  contact: {}
  description: Blog_Server API文档
  title: Blog_Server API文档
  version: "1.0"
paths:
  /api/adverts:
    delete:
      consumes:
      - application/json
      description: 批量删除广告
      parameters:
      - description: 广告id列表
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/models.RemoveRequest'
      - description: token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误（如id格式错误、列表为空）
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: 部分广告id不存在
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 批量删除广告
      tags:
      - 广告管理
    get:
      description: 分页查询广告列表，支持根据标题、链接等条件筛选
      parameters:
      - description: 标题筛选（模糊匹配）
        in: query
        name: title
        type: string
      - description: 链接筛选（模糊匹配）
        in: query
        name: href
        type: string
      - description: 图片筛选（模糊匹配）
        in: query
        name: images
        type: string
      - description: 是否展示（true/false）
        in: query
        name: is_show
        type: boolean
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认10
        in: query
        name: limit
        type: integer
      - description: 用户认证令牌
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/res.Response'
            - properties:
                data:
                  $ref: '#/definitions/res.DataListResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 获取广告列表
      tags:
      - 广告管理
    post:
      consumes:
      - application/json
      description: 创建一个新的广告条目，包含标题、跳转链接、图片和展示状态
      parameters:
      - description: 广告信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/advert_api.AdvertRequest'
      - description: 用户认证令牌
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/res.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/res.Response'
      summary: 创建广告
      tags:
      - 广告管理
  /api/adverts/{id}:
    put:
      consumes:
      - application/json
      description: 更新广告
      parameters:
      - description: 更新的广告信息（可选字段，如title/href等，不传则不更新）
        in: body
        name: data
        schema:
          $ref: '#/definitions/advert_api.AdvertUpdateRequest'
      - description: id
        in: path
        name: id
        required: true
        type: integer
      - description: token
        in: header
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/res.Response'
        "400":
          description: 请求参数错误（如ID格式错误、标题重复等）
          schema:
            $ref: '#/definitions/res.Response'
        "404":
          description: 广告不存在
          schema:
